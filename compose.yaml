services:
  app:
    build:
      context: .
      args:
        CLAUDE_CODE_CHANNEL: stable
    image: gitlab-security-review:local
    command: ["app"]
    restart: unless-stopped
    environment:
      REPORT_DIR: /data/reports
      STATE_DB: /data/state/reviews.sqlite3
      HEARTBEAT_FILE: /tmp/reviewer-heartbeat
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - review-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  review-data:
